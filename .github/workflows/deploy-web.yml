# Deploy the WASM web console to AWS (S3 + CloudFront).
#
# Designed as if the repo is public:
# - No long-lived AWS access keys in the repository
# - OIDC assume-role (AWS_ROLE_ARN from GitHub Variables / Environment)
# - Only runs for the canonical repo + main (forks never get credentials)
# - Production environment gate for optional required reviewers
#
# Maintainer setup: see docs/DEPLOYMENT.md

name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'crates/ua571-core/**'
      - 'crates/ua571-render/**'
      - 'crates/ua571-web/**'
      - 'web/**'
      - 'scripts/build-web.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Never cancel an in-flight production sync (half-uploaded pkg/ is worse).
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WASM_BINDGEN_VERSION: "0.2.100"

jobs:
  deploy:
    name: Build WASM + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Canonical repo only — PRs/forks never deploy even if workflow is copied.
    if: github.repository == 'danielendara/ua571' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require deploy configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          UA571_S3_BUCKET: ${{ vars.UA571_S3_BUCKET }}
          UA571_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.UA571_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=0
          for v in AWS_ROLE_ARN UA571_S3_BUCKET UA571_CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub variable $v (see docs/DEPLOYMENT.md)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pin
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm32

      - name: Build web package
        run: |
          chmod +x scripts/build-web.sh
          ./scripts/build-web.sh

      - name: Verify package artifacts
        run: |
          test -f web/index.html
          test -f web/pkg/ua571_web.js
          test -f web/pkg/ua571_web_bg.wasm
          test -f web/build-id.js
          wasm-bindgen --version | grep -F "${WASM_BINDGEN_VERSION}"
          ls -la web/pkg

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        env:
          UA571_S3_BUCKET: ${{ vars.UA571_S3_BUCKET }}
        run: |
          set -euo pipefail
          CACHE="public,max-age=60,must-revalidate"
          # 1) pkg/ first with --delete scoped to that prefix (never delete dest
          #    pkg/ from a parent sync that excludes it).
          aws s3 sync web/pkg/ "s3://${UA571_S3_BUCKET}/pkg/" \
            --delete \
            --cache-control "${CACHE}"
          aws s3 cp web/pkg/ua571_web_bg.wasm "s3://${UA571_S3_BUCKET}/pkg/ua571_web_bg.wasm" \
            --content-type "application/wasm" \
            --cache-control "${CACHE}"
          # 2) Site chrome. No --delete: excluding pkg/* plus --delete would
          #    treat destination pkg/ as extra and wipe the just-uploaded WASM.
          aws s3 sync web/ "s3://${UA571_S3_BUCKET}/" \
            --exclude "pkg/*" \
            --exclude ".gitignore" \
            --cache-control "${CACHE}"

      - name: Invalidate CloudFront
        env:
          UA571_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.UA571_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${UA571_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "### Deployed ua571 web" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** https://ua571.danielendara.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bucket:** \`${{ vars.UA571_S3_BUCKET }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Distribution:** \`${{ vars.UA571_CLOUDFRONT_DISTRIBUTION_ID }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
