# Deploy the WASM web console to AWS (S3 + CloudFront).
#
# Designed as if the repo is public:
# - No long-lived AWS access keys in the repository
# - OIDC assume-role (AWS_ROLE_ARN from GitHub Variables / Environment)
# - Only runs for the canonical repo + main (forks never get credentials)
# - Production environment gate for optional required reviewers
#
# Maintainer setup: see docs/DEPLOYMENT.md

name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'crates/ua571-core/**'
      - 'crates/ua571-render/**'
      - 'crates/ua571-web/**'
      - 'web/**'
      - 'scripts/build-web.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WASM_BINDGEN_VERSION: "0.2.100"

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'danielendara/ua571' && github.ref == 'refs/heads/main'
    # Newer pushes cancel superseded builds before any production approval or upload.
    concurrency:
      group: deploy-web-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action pin
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: wasm32

      - name: Build web package
        run: |
          chmod +x scripts/build-web.sh
          ./scripts/build-web.sh

      - name: Verify package artifacts
        run: |
          ./scripts/verify-web-artifacts.sh
          wasm-bindgen --version | grep -F "${WASM_BINDGEN_VERSION}"

      - name: Upload web package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-package
          path: web/
          if-no-files-found: error

  sync:
    name: Sync to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: github.repository == 'danielendara/ua571' && github.ref == 'refs/heads/main'
    environment: production
    # Never cancel an in-flight S3/CloudFront sync; default queue cancels an older *pending* sync run.
    concurrency:
      group: deploy-web-sync-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Download web package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: web-package
          path: web

      - name: Require deploy configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          UA571_S3_BUCKET: ${{ vars.UA571_S3_BUCKET }}
          UA571_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.UA571_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=0
          for v in AWS_ROLE_ARN UA571_S3_BUCKET UA571_CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing GitHub variable $v (see docs/DEPLOYMENT.md)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        env:
          UA571_S3_BUCKET: ${{ vars.UA571_S3_BUCKET }}
        run: |
          set -euo pipefail
          CACHE="public,max-age=60,must-revalidate"
          # pkg/ URLs use ?v=BUILD_ID on glue/wasm — safe to cache for a year.
          PKG_CACHE="public,max-age=31536000,immutable"
          # 1) pkg/ first with --delete scoped to that prefix (never delete dest
          #    pkg/ from a parent sync that excludes it).
          aws s3 sync web/pkg/ "s3://${UA571_S3_BUCKET}/pkg/" \
            --delete \
            --exclude "*" \
            --include "*.js" \
            --include "*.wasm" \
            --cache-control "${PKG_CACHE}"
          aws s3 cp web/pkg/ua571_web_bg.wasm "s3://${UA571_S3_BUCKET}/pkg/ua571_web_bg.wasm" \
            --content-type "application/wasm" \
            --cache-control "${PKG_CACHE}"
          # 2) Site chrome. No --delete: excluding pkg/* plus --delete would
          #    treat destination pkg/ as extra and wipe the just-uploaded WASM.
          aws s3 sync web/ "s3://${UA571_S3_BUCKET}/" \
            --exclude "*" \
            --include "index.html" \
            --include "main.js" \
            --include "prefs.js" \
            --include "sentry-row.js" \
            --include "sentry-row.css" \
            --include "build-id.js" \
            --include "style.css" \
            --include "*.png" \
            --cache-control "${CACHE}"
          # s3 sync has no .webmanifest MIME mapping and would store it as
          # binary/octet-stream, which breaks installability.
          aws s3 cp web/manifest.webmanifest "s3://${UA571_S3_BUCKET}/manifest.webmanifest" \
            --content-type "application/manifest+json" \
            --cache-control "${CACHE}"

      - name: Invalidate CloudFront
        env:
          UA571_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.UA571_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${UA571_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "### Deployed ua571 web" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL:** https://ua571.danielendara.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bucket:** \`${{ vars.UA571_S3_BUCKET }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Distribution:** \`${{ vars.UA571_CLOUDFRONT_DISTRIBUTION_ID }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"