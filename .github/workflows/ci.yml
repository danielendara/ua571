name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege for a public repo. Jobs that need more must opt in.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  secret-guard:
    name: secret-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Block secrets / AWS context files
        run: |
          chmod +x scripts/check-secrets.sh
          ./scripts/check-secrets.sh tracked
          # Extra belt: these paths must never appear in the tree
          if git ls-files | grep -E '(^|/)cdk\.context\.json$|(^|/)cdk\.out/|\.env$|credentials$'; then
            echo "::error::Forbidden path is tracked by git"
            exit 1
          fi
          echo "secret-guard OK"

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release

  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build web package
        run: ./scripts/build-web.sh
