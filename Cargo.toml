[workspace]
resolver = "2"
members = [
    "crates/ua571-core",
    "crates/ua571-render",
    "crates/ua571-tui",
    "crates/ua571-pixel",
    "crates/ua571-web",
]
default-members = ["crates/ua571-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/danielendara/ua571"
authors = ["Daniel Endara"]
rust-version = "1.80"

[workspace.dependencies]
ua571-core = { path = "crates/ua571-core", version = "0.1.0" }
ua571-render = { path = "crates/ua571-render", version = "0.1.0" }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
dirs = "6"
minifb = "0.28"
# Pin to match installed wasm-bindgen-cli (scripts/build-web.sh).
wasm-bindgen = "=0.2.100"
js-sys = "0.3.77"
web-sys = "0.3.77"
console_error_panic_hook = "0.1"
web-time = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
